      <path id="letter-l-2" transform="translate(876)" d="M8 0H24V122C24 132 28 136 38 136H48V160H36C13 160 0 147 0 124V8L8 0Z"/>
      <path id="letter-i" transform="translate(946)" d="M8 0H24V24H0V8L8 0ZM0 40H24V160H0V40Z"/>
